# Netlify publie la landing page telle quelle, sans étape de build.
[build]
  publish = "landing"
  command = ""

# L'ancienne page Produits fait maintenant partie de la page d'accueil.
[[redirects]]
  from = "/produits.html"
  to = "/#produits"
  status = 301

# L'inscription se fait maintenant dans l'application : les anciens liens mènent à Google Play.
[[redirects]]
  from = "/inscription.html"
  to = "https://play.google.com/store/apps/details?id=com.abahz.abahz"
  status = 301
  force = true

[[redirects]]
  from = "/inscription"
  to = "https://play.google.com/store/apps/details?id=com.abahz.abahz"
  status = 301
  force = true

# L'installateur Windows est publié dans les releases du dépôt GitHub abahz/deskApp.
[[redirects]]
  from = "/Abahz.msi"
  to = "https://github.com/abahz/deskApp/releases/download/v1.8.4/Abahz.msi"
  status = 302
  force = true
